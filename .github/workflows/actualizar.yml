name: Actualizar cortes y publicar

on:
  schedule:
    # 00:05, 06:05, 12:05 y 18:05 de Lima (UTC-5): a medianoche "hoy" pasa al día nuevo.
    - cron: "5 5,11,17,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python -m pytest -q scraper/tests site

      - name: Datos anteriores (rama "data")
        run: |
          mkdir -p out
          git fetch --depth=1 origin data:data 2>/dev/null && git show data:cortes.json > previous.json || echo '{}' > previous.json

      - name: Descargar avisos de Pluz y Luz del Sur
        run: python -m scraper --previous previous.json --output out/cortes.json

      - name: Generar el sitio
        run: python site/build.py --data out/cortes.json --out public

      - name: Guardar datos en la rama "data"
        run: |
          mkdir -p data-branch && cp out/cortes.json data-branch/
          cd data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cortes.json
          git commit -q -m "Cortes $(TZ=America/Lima date '+%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
